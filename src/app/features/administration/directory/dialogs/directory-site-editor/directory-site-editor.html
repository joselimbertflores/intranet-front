<hlm-dialog-header class="shrink-0 pb-4">
  <h3 hlmDialogTitle>{{ site ? "Editar sede" : "Nueva sede" }}</h3>
</hlm-dialog-header>

<div class="-mx-4 min-h-0 flex-1 overflow-y-auto px-4 pb-4">
  <form
    id="directory-site-editor-form"
    class="flex flex-col gap-5"
    [formRoot]="siteForm"
  >
    <div hlmField>
      <label hlmFieldLabel for="directory-site-name">Nombre</label>
      <input
        hlmInput
        id="directory-site-name"
        type="text"
        autocomplete="organization"
        placeholder="Ej. Edificio central"
        [formField]="siteForm.name"
      />
      @if (siteForm.name().touched()) {
        @for (error of siteForm.name().errors(); track error.kind) {
          <hlm-field-error [validator]="error.kind">
            {{ error.message }}
          </hlm-field-error>
        }
      }
    </div>

    <div hlmField orientation="horizontal">
      <hlm-checkbox
        inputId="directory-site-active"
        [formField]="siteForm.isActive"
      />
      <div>
        <label hlmFieldLabel for="directory-site-active">Sede activa</label>
        <p hlmFieldDescription>
          Solo las sedes activas pueden asignarse a contactos nuevos.
        </p>
      </div>
    </div>
  </form>
</div>

<hlm-dialog-footer class="shrink-0">
  <button
    hlmBtn
    type="button"
    variant="outline"
    [disabled]="siteForm().submitting()"
    (click)="close()"
  >
    Cancelar
  </button>
  <button
    hlmBtn
    type="submit"
    form="directory-site-editor-form"
    [disabled]="siteForm().submitting()"
  >
    @if (siteForm().submitting()) {
      <hlm-spinner data-icon="inline-start" />
      Guardando...
    } @else {
      Guardar
    }
  </button>
</hlm-dialog-footer>
