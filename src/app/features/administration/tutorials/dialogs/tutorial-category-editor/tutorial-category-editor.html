<hlm-dialog-header>
  <h3 hlmDialogTitle>{{ category ? "Editar categoría" : "Nueva categoría" }}</h3>
</hlm-dialog-header>

<form id="tutorial-category-form" class="flex flex-col gap-5 py-2" [formRoot]="categoryForm">
  <div hlmField>
    <label hlmFieldLabel for="tutorial-category-name">Nombre</label>
    <input
      hlmInput
      id="tutorial-category-name"
      type="text"
      autocomplete="off"
      placeholder="Ej. Sistemas institucionales"
      [formField]="categoryForm.name"
    />
    @if (categoryForm.name().touched()) {
      @for (error of categoryForm.name().errors(); track error.kind) {
        <hlm-field-error [validator]="error.kind">{{ error.message }}</hlm-field-error>
      }
    }
  </div>

  @if (category?.slug) {
    <p class="text-sm text-muted-foreground">
      Slug actual: <code class="rounded bg-muted px-1.5 py-0.5">{{ category?.slug }}</code>
    </p>
  }

</form>

<hlm-dialog-footer>
  <button hlmBtn type="button" variant="outline" [disabled]="categoryForm().submitting()" (click)="close()">
    Cancelar
  </button>
  <button hlmBtn type="submit" form="tutorial-category-form" [disabled]="categoryForm().submitting()">
    @if (categoryForm().submitting()) {
      <hlm-spinner data-icon="inline-start" /> Guardando...
    } @else {
      Guardar
    }
  </button>
</hlm-dialog-footer>
