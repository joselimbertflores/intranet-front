@if (locations().length) {
  <section
    class="isolate overflow-hidden rounded-xl border border-border bg-card shadow-sm"
    aria-label="Mapa de sedes"
  >
    <div #map class="h-[32rem] w-full sm:h-[38rem]"></div>
  </section>
} @else {
  <div
    class="flex min-h-72 flex-col items-center justify-center rounded-xl border border-border bg-card px-6 py-12 text-center"
  >
    <ng-icon name="lucideMapPinOff" class="text-3xl text-muted-foreground" />
    <h2 class="mt-4 text-lg font-semibold">No hay sedes con ubicación</h2>
    <p class="mt-1 max-w-md text-sm text-muted-foreground">
      El mapa estará disponible cuando existan coordenadas registradas.
    </p>
  </div>
}
